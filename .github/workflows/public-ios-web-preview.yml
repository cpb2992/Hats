# Public Hats 2.0 web preview for Safari on iPhone.
# Upload this file to .github/workflows/public-ios-web-preview.yml on the public branch.
# NEVER use --prod here: personal Hats production remains at https://hats-family.expo.app.
name: Public Hats iPhone web preview

on:
  push:
    branches: [public]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hats-public-ios-web-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build, publish and check the public Safari preview
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PREVIEW_URL: https://hats-family--public-ios-preview.expo.app
    steps:
      - name: Check out public Hats 2.0 only
        uses: actions/checkout@v4
        with:
          ref: public

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check Expo credentials
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN repository secret."
            exit 1
          fi

      - name: Set up Expo deployment tools
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web for Safari
        run: |
          npx expo export --platform web
          test -s dist/index.html

      - name: Publish isolated preview alias (NOT production)
        run: |
          set -o pipefail
          eas deploy --alias public-ios-preview --non-interactive 2>&1 | tee deploy.log
          echo "### Public Hats for iPhone" >> "$GITHUB_STEP_SUMMARY"
          echo "Non-production preview published from public branch." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify preview responds
        run: |
          curl --fail --location --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors "$PREVIEW_URL" -o /tmp/preview.html
          grep -qi '<html' /tmp/preview.html
          echo "**Safari preview:** $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "To install an app-like shortcut, open in Safari and choose Share > Add to Home Screen." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Public Hats iPhone preview::$PREVIEW_URL"
