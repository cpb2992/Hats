# Builds an installable test copy of public Hats (Hats-public.apk) on every push to the public branch and
# attaches it to a pre-release. It has its own package name, so it installs beside your personal Hats.
#
# This build is signed with React Native's debug key: fine for your own phone, not for the Play Store.
# Store builds go through EAS (see README, step 3).
name: Build Android app

on:
  push:
    branches: [public]
    paths-ignore: ['**.md', 'LICENSE', '.env.example']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck

      - name: Test the engine
        run: npm test

      - name: Stamp the build number
        run: node -e "const f='app.json';const j=require('./'+f);j.expo.extra={...(j.expo.extra||{}),build:'${{ github.run_number }}'};require('fs').writeFileSync(f,JSON.stringify(j,null,2))"

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the app
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Read the version
        id: ver
        run: echo "version=$(node -p "require('./app.json').expo.version")" >> "$GITHUB_OUTPUT"

      - name: Name the file
        run: cp android/app/build/outputs/apk/release/app-release.apk Hats-public.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: public-build-${{ github.run_number }}
          # Tag the commit that was built (not the default branch), so the release page shows the right code.
          target_commitish: ${{ github.sha }}
          name: Public Hats ${{ steps.ver.outputs.version }} (test build ${{ github.run_number }})
          body: |
            Test copy of the public version, version ${{ steps.ver.outputs.version }}, built from ${{ github.sha }}.
            Download Hats-public.apk on your phone and tap it to install. It sits beside your personal Hats.
            Check you have it: Settings → bottom of the page shows "Hats ${{ steps.ver.outputs.version }} · build ${{ github.run_number }}".
          files: Hats-public.apk
          prerelease: true
          make_latest: false
