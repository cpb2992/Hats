name: Hats installed-app and account acceptance
on:
  pull_request:
    branches: [codex/hats-personal-life, public]
permissions:
  contents: read
concurrency:
  group: hats-acceptance-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: Start disposable local Auth and database
        run: |
          mkdir -p "$RUNNER_TEMP/hats-local"
          cd "$RUNNER_TEMP/hats-local"
          supabase init
          cp -r "$GITHUB_WORKSPACE/supabase/migrations" supabase/
          supabase start > "$RUNNER_TEMP/hats-local-start.log" 2>&1
          supabase status -o json > "$RUNNER_TEMP/hats-local-status.json"
      - name: Verify independent accounts and family handoff
        env:
          HATS_LOCAL_STATUS: ${{ runner.temp }}/hats-local-status.json
        run: node --import tsx scripts/release-readiness/backend.test.ts
      - name: Stop disposable services
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/hats-local" ]; then
            cd "$RUNNER_TEMP/hats-local"
            supabase stop --no-backup
          fi
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Reuse an APK only for identical app source
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: hats-native-apk-${{ runner.os }}-${{ hashFiles('src/**', 'assets/**', 'modules/**', 'app.json', 'package-lock.json', 'index.ts') }}
      - if: steps.apk.outputs.cache-hit != 'true'
        run: npx expo prebuild --platform android --no-install
      - name: Build installed Android release for emulator
        if: steps.apk.outputs.cache-hit != 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Cache the exact-source APK before acceptance checks
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: android/app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - name: Build disposable real widget host
        run: bash scripts/release-readiness/build-widget-host.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone America/New_York
          script: python3 scripts/release-readiness/native-test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hats-installed-acceptance-${{ github.event.pull_request.number }}
          path: release-results
